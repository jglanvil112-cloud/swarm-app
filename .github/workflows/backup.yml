name: Nightly Supabase Backup

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Validate backup secret
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          test -n "$SUPABASE_DB_URL" || (echo "SUPABASE_DB_URL secret is missing" && exit 1)

      - name: Dump database
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          TS=$(date -u +%Y%m%d_%H%M%S)
          pg_dump "$SUPABASE_DB_URL" --no-owner --no-acl -F p > "backup_${TS}.sql"
          gzip "backup_${TS}.sql"
          ls -lh backup_*.sql.gz

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: supabase-backup-${{ github.run_number }}
          path: backup_*.sql.gz
          retention-days: 30
          if-no-files-found: error
